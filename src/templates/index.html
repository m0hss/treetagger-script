<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <title>Home</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #f8f9fa;
      color: #343a40;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2rem;
      padding: 2rem;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .subcontainer {
      margin: none;
      width: 100%;
    }

    /* Styles for the form */
    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* Styles for the form elements */
    .form-label {
      margin-bottom: 0.3rem;
    }
    .form-label-language {
      margin-top: 1.2rem;
    }

    .form-control {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .custom-file-label {
      cursor: pointer;
      padding: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .custom-file-label:hover {
      background-color: #ececec;
    }

    .btn {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 2rem;
    }

    h1 {
      margin-bottom: 3rem;
    }

    #loading {
      display: none;
      font-size: 1.5rem;
      color: blue;
      margin-top: 2rem;
    }

    #results {
      margin-top: 5rem;
    }

    .spinner-border {
      width: 3rem;
      height: 3rem;
      margin-top: 1rem;
    }

    .results-container {
      display: none;
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .error-message {
      color: rgb(2, 2, 2);
      font-size: 14px;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
      border: 0.5em;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background-color: #f79696;
      padding: 2px 0px 2px 0px;
    }

    /* Styles for the navigation tabs */
    .nav-tabs {
      margin-top: 2rem;
      margin-bottom: 2rem;
      /* border-bottom: 1px solid #dee2e6; */
    }

    .nav-link {
      margin: 0;
      padding: 0.5rem 1rem;
      font-size: 1.1rem;
      color: #495057;
    }

    .nav-link.active {
      color: #0d6efd !important;
      /* border-bottom: none; */
    }

    .tab-content {
      width: 100%;
      padding: 1rem;
      background-color: #ffffff;
      border: 1px solid #dee2e6;
      border-top: none;
    }

    .tab-pane {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      /* border-bottom: 2px !important; */
    }

    .select-wrapper {
      position: relative;
      width: 100%;
    }

    .select-wrapper select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 100%;
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ced4da;
      border-radius: 0.25rem;
      background-color: #ffffff;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNiIgaGVpZ2h0PSIxNiIgZmlsbD0iY3VycmVudENvbG9yIiBjbGFzcz0iYmkgYmktY2FyZXQtZG93bi1maWxsIiB2aWV3Qm94PSIwIDAgMTYgMTYiPjxwYXRoIGQ9Ik03LjI0NyAxMS4xNGwtNC43OTYtNS40ODFDMS44MjggNS4yMTYgMi4wNiA1IDIgNWgxMS4yOTJjLjI5NCAwIC41MjYuMjE2LjkzLjY1OWwtNC43OTYgNS40ODFhLjUuNSAwIDAgMS0uNzA4IDB6Ii8+PC9zdmc+');
      background-repeat: no-repeat;
      background-position: right 0.75rem center;
      background-size: 14px 14px;
    }

    .select-wrapper::after {
      /* content: "choose langue"; */
      position: absolute;
      top: 50%;
      right: 1rem;
      width: 0.8rem;
      height: 0.5rem;
      pointer-events: none;
      border-left: 0.15em solid #495057;
      border-right: 0.15em solid #495057;
      border-bottom: 0.15em solid #495057;
      transform: translateY(-50%);
    }
  </style>
</head>

<body>
  <div class="container mt-16">
    <h1>Perl TreeTagger Project</h1>
    <div class="subcontainer mt-8">
      <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#text" type="button"
            role="tab" aria-controls="text" aria-selected="true">Text</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="upload-tab" data-bs-toggle="tab" data-bs-target="#upload" type="button"
            role="tab" aria-controls="upload" aria-selected="false">Upload File</button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="text" role="tabpanel" aria-labelledby="text-tab">
          <form id="searchForm" method="post" action="/process_text" enctype="multipart/form-data" class="form">
            <label for="dictionary" class="form-label">Select Dictionary*</label>
            <div class="select-wrapper">
              <select name="dictionary" class="form-control">
                <option value="dict1">Expressions Idiomatiques (fp.xml)</option>
              </select>
            </div>
            <label for="request" class="form-label">Type a text here*</label>
            <textarea name="request" rows="10" cols="100" class="form-control"></textarea>
            <label for="language" class="form-label">Language of your text*</label>
            <div class="select-wrapper">
              <select name="language" class="form-control">
                <option value="fr">French</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
              </select>
            </div>
            <input type="submit" name="Search" value="Search" class="btn btn-primary mt-2" />
          </form>
        </div>
        <div class="tab-pane fade" id="upload" role="tabpanel" aria-labelledby="upload-tab">
          <form id="uploadForm" method="post" action="/process_file" enctype="multipart/form-data" class="form">
            <label for="dictionary" class="form-label">Select Dictionary*</label>
            <div class="select-wrapper">
              <select name="dictionary" class="form-control">
                <option value="dict1">Expressions Idiomatiques (fp.xml)</option>
              </select>
            </div>
            <label for="file" class="form-label">Upload file here*</label>
            <div class="input-group mb-3">
              <input type="text" class="form-control" id="file-path" placeholder="Choose file..." readonly>
              <input type="file" name="file" class="form-control" id="inputGroupFile" accept=".txt"
                style="display: none">
              <label class="input-group-text custom-file-label" for="inputGroupFile">Browse...</label>
            </div>
            <small class="form-text text-muted" style="margin-top: -2.5rem; font-size: 12px;">Please provide a plain text
              file (.txt) with UTF-8 encoding.</small>
            <label for="language" class="form-label-language">Language of your text*</label>
            <div class="select-wrapper">
              <select name="language" class="form-control">
                <option value="fr">French</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
              </select>
            </div>
            <input type="submit" name="Upload" value="Search" class="btn btn-primary mt-2" />
          </form>
        </div>
      </div>
    </div>
  </div>
  </div>
  <div id="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  <div class="container results-container">
    <div id="results"></div>
  </div>
</body>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
<script>
  $(document).ready(function () {
    $('.results-container').hide();
    $('form').on('submit', function (e) {
      e.preventDefault();
      // Check if textarea is empty
      var textarea = $('textarea[name="request"]');
      if (!textarea.val().trim()) {
        var errorMessage = $('<div class="alert alert-danger" style="font-size: 15px; padding: 5px 10px; margin-bottom: 10px;">Please enter some text</div>');
        textarea.after(errorMessage);
        setTimeout(function () {
          errorMessage.fadeOut('slow', function () {
            $(this).remove();
          });
        }, 2000);
        return;
      }
      $('#loading').show();
      $.ajax({
        type: 'POST',
        url: $(this).attr('action'),
        data: $(this).serialize(),
        success: function (data) {
          $('#loading').hide();
          $('#results').html(data);
          $('.results-container').show();
        },
        error: function (xhr, status, error) {
          $('#loading').hide();
          $('#results').html('<div class="alert alert-danger">An error occurred: ' + error + '</div>');
        }
      });
    });

    $('#uploadForm').on('submit', function (e) {
      e.preventDefault();
      // $('textarea[name="request"]').val('');

      var fileInput = $('#inputGroupFile');
      if (!fileInput.val()) {
        var errorMessage = $('<div class="alert alert-danger" style="font-size: 15px; align-self: center; padding: 9px">Please choose a file to upload</div>');
        fileInput.after(errorMessage);
        setTimeout(function () {
          errorMessage.fadeOut('slow', function () {
            $(this).remove();
          });
        }, 2000);
        return;
      }

      var formData = new FormData(this);
      $('#loading').show();
      $.ajax({
        type: 'POST',
        url: $(this).attr('action'),
        data: formData,
        contentType: false,
        processData: false,
        success: function (data) {
          $('#loading').hide();
          $('#results').html(data);
          $('.results-container').show();
        },
        error: function (xhr, status, error) {
          // $('#loading').hide();
          $('#results').html('<div class="alert alert-danger">An error occurred: ' + error + '</div>');
        }
      });
    });
    $('#myTab button').on('click', function (e) {
      if ($(this).attr('id') === 'upload-tab') {
        $('textarea[name="request"]').val('');
      }
    });
  });

  document.getElementById('inputGroupFile').addEventListener('change', function () {
    document.getElementById('file-path').value = this.files[0].name;
  });
</script>

</html>
